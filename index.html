<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176756"><meta name="description" content="LPの変更履歴と成果をひとつに。LP管理・比較・分析アプリ。"><title>LP Note | LP管理・分析</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css?v=1.1"><script defer src="core.js?v=1.1"></script><script defer src="app.js?v=1.1"></script></head>
<body>
<aside class="sidebar"><a class="brand" href="#"><span class="brand-icon">L<span>↗</span></span><span>LP Note<small>LP管理・分析</small></span></a><div class="nav-label">WORKSPACE</div><nav aria-label="メインメニュー"><button data-nav="dashboard" class="active">◫ <span>ダッシュボード</span></button><button data-nav="lps">▤ <span>LP・変更履歴</span></button><button data-nav="records">＋ <span>日別実績</span></button><button data-nav="ranking">↗ <span>比較・ランキング</span></button><button data-nav="backup">▣ <span>バックアップ</span></button></nav><div class="sidebar-bottom"><span class="status-dot"></span> このブラウザに保存<small>CRMとは独立したアプリ<br>LP Note / version 1.1</small></div></aside>
<main><div class="topline"><span>YOUR LANDING PAGE WORKSPACE</span><button id="demo-toggle" class="text-button">サンプルを見る</button></div><div id="demo-banner" class="notice" hidden>サンプル表示中 · 架空のデータです。実データには保存されません。<button id="demo-exit">実データに戻る</button></div><div id="storage-alert" class="alert" hidden></div><header><div><p id="eyebrow" class="eyebrow">OVERVIEW</p><h1 id="page-title">ダッシュボード</h1><p id="page-subtitle">LPの変化を、成果につなげる。</p></div><div class="actions"><button class="secondary" data-action="add-lp">＋ LPを登録</button><button class="primary" data-action="add-record">＋ 実績を入力</button></div></header><div id="daily-content"></div><section id="filters" class="filterbar" aria-label="集計条件"><label>集計期間<select id="period"><option value="month">今月</option><option value="last">先月</option><option value="today">今日</option><option value="yesterday">昨日</option><option value="all">全期間</option><option value="custom">期間を指定</option></select></label><label class="custom-date" hidden>開始日<input id="start" type="date"></label><label class="custom-date" hidden>終了日<input id="end" type="date"></label><label>対象LP<select id="lp-filter"><option value="">すべてのLP</option></select></label><span id="range-label" class="muted"></span></section><div id="filter-error" class="alert" hidden>開始日・終了日を正しく指定してください。</div><div id="content"></div><footer>入力データはこのブラウザ内だけに保存されます。端末間の自動同期はありません。<br>消失に備えて「バックアップ」から定期的に保存してください。</footer></main>
<dialog id="editor"><form id="entry-form"><div class="dialog-head"><h2 id="editor-title"></h2><button type="button" id="editor-close" class="icon-button" aria-label="閉じる">×</button></div><div id="form-fields"></div><p id="entry-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" id="editor-cancel">キャンセル</button><button type="submit" class="primary">保存する</button></div></form></dialog>
<dialog id="confirm"><h2 id="confirm-title">確認</h2><p id="confirm-message"></p><div class="dialog-actions"><button id="confirm-no">キャンセル</button><button id="confirm-yes" class="primary">実行する</button></div></dialog><div id="toast" role="status" aria-live="polite"></div>
</body></html>
